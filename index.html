<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1518">
<meta name="description" content="Эвглена, хламидомонада және криптофитті балдырдың интерактивті 3D құрылысы.">
<title>Микроәлем · 3D</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script defer src="assets/three.min.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main id="stage" aria-label="Біржасушалы ағзалардың интерактивті 3D моделі">
<canvas id="scene" aria-label="3D модель. Айналдыру үшін сүйреңіз, үлкейту үшін тінтуір дөңгелегін қолданыңыз." tabindex="0"></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels"></div>
<p id="error" role="alert" hidden>3D модельді көрсету үшін WebGL қолдайтын браузер қажет.</p>
</main>
<nav id="species" aria-label="Ағзаны таңдау">
<button data-model="0" aria-pressed="true"><i></i>Эвглена</button>
<button data-model="1" aria-pressed="false"><i></i>Хламидомонада</button>
<button data-model="2" aria-pressed="false"><i></i>Криптофитті балдыр</button>
</nav>
<div id="tools" role="group" aria-label="Көріністі басқару">
<button id="rotate" aria-label="Айналуды тоқтату" aria-pressed="true" title="Айналу · Space"><svg viewBox="0 0 24 24"><path id="play-icon" d="M9 6v12M15 6v12"/></svg></button>
<button id="annotate" aria-label="Атауларды көрсету" aria-pressed="true" title="Атаулар · L"><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="2"/><path d="m8 15 5-8h7M14 11h6"/></svg></button>
<button id="reset" aria-label="Бастапқы көрініс" title="Бастапқы көрініс · R"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg></button>
<button id="fullscreen" aria-label="Толық экран" title="Толық экран · F"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
</div>
<noscript>3D модельді көру үшін JavaScript қосыңыз.</noscript>
</body>
</html>
